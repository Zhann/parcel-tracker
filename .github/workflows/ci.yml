name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# fmt, lint, type-check and the tests, none of which touch the network. Swamp
# itself is not needed: the behavior's tests drive it through a fake context.
jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.8.3
      - run: deno task check
      - run: deno task test
